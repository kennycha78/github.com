<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수면검사 신청하기</title>
    <style>
        /* 대장님이 좋아하는 보라색과 둥근 모서리 디자인이에요! */
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2 { color: #5247D4; text-align: center; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input, select { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; }
        .btn-submit { background-color: #5247D4; color: white; border: none; width: 100%; padding: 15px; margin-top: 25px; border-radius: 10px; font-size: 18px; cursor: pointer; }
        
        /* 마스크 선택 카드 디자인 */
        .mask-option { margin-top: 10px; display: flex; gap: 10px; flex-direction: column; }
        .mask-card { border: 2px solid #eee; padding: 10px; border-radius: 10px; cursor: pointer; }
        input[type="radio"] { width: auto; margin-right: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>수면검사 장비 신청</h2>
    
    <form action="https://script.google.com/macros/s/AKfycbxzb6rUC8XD2ntYCHhkmsVaPcunXLeV0CKfxXnej_wql4_34hEKd_IWnwQfXisKPd1n/exec" 
          method="GET" target="hidden_iframe" onsubmit="submitted=true;">

        <label>환자 이름</label>
        <input type="text" name="name" placeholder="성함을 입력하세요" required>

        <label>전화번호</label>
        <input type="tel" name="phone" placeholder="010-0000-0000" required>

        <label>주민번호 앞 6자리 + 뒷 1자리</label>
        <input type="text" name="ssn" placeholder="예: 800101-1" required>

        <label>마스크 선택</label>
        <select name="mask">
            <option value="나잘">나잘 (19,000원)</option>
            <option value="필로우">필로우 (62,000원)</option>
            <option value="풀페이스">풀페이스 (62,000원)</option>
        </select>

        <label>검사 날짜</label>
        <input type="date" name="date" required>

        <label>병원명 + 지역</label>
        <input type="text" name="hospital" placeholder="예: 삼성숨소리의원 강남" required>

        <button type="submit" class="btn-submit">신청하기</button>
    </form>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { alert('신청이 완료되었습니다! 담당자가 곧 연락드릴게요. 😊'); location.reload(); }"></iframe>
</div>

<script>
    var submitted = false;
</script>

</body>
</html>
