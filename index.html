<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검사 장비 신청서</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #F5F6FA;
    min-height: 100vh;
    padding: 24px 16px 48px;
    color: #1a1a1a;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    padding: 28px 28px 32px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.07);
  }
  .header { margin-bottom: 24px; text-align: center; }
  .header-badge {
    display: inline-block;
    background: #EEEDFE;
    color: #5247D4;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 12px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .header h1 { font-size: 22px; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; }
  .header p { font-size: 13px; color: #888; line-height: 1.5; }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #5247D4;
    margin: 20px 0 12px;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #555;
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #E8E8EE;
    border-radius: 10px;
    font-size: 15px;
    color: #1a1a1a;
    background: #fff;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    -webkit-appearance: none;
  }
  .field input:focus, .field select:focus {
    border-color: #5247D4;
    box-shadow: 0 0 0 3px rgba(82,71,212,0.1);
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .divider { border: none; border-top: 1.5px solid #F0F0F5; margin: 20px 0; }
  .mask-options { display: flex; flex-direction: column; gap: 10px; }
  .mask-option {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    border: 1.5px solid #E8E8EE;
    border-radius: 12px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
  }
  .mask-option:hover { background: #F8F8FF; border-color: #AFA9EC; }
  .mask-option.selected { border-color: #5247D4; background: #EEEDFE; }
  .mask-option input[type=radio] { display: none; }
  .radio-dot {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid #CCC; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .mask-option.selected .radio-dot { border-color: #5247D4; }
  .radio-dot::after {
    content: ''; width: 10px; height: 10px;
    border-radius: 50%; background: #5247D4;
    display: none;
  }
  .mask-option.selected .radio-dot::after { display: block; }
  .mask-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .mask-icon.nasal { background: #E1F5EE; }
  .mask-icon.pillow { background: #E6F1FB; }
  .mask-icon.fullface { background: #FAEEDA; }
  .mask-info { flex: 1; min-width: 0; }
  .mask-top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .mask-name { font-size: 14px; font-weight: 700; color: #1a1a1a; }
  .mask-price { font-size: 15px; font-weight: 700; color: #5247D4; white-space: nowrap; }
  .mask-desc { font-size: 12px; color: #888; margin-top: 3px; line-height: 1.4; }
  .date-row { display: grid; grid-template-columns: 110px 1fr 1fr; gap: 8px; }
  .submit-btn {
    width: 100%; padding: 15px;
    border: none; border-radius: 12px;
    background: #5247D4; color: #fff;
    font-size: 16px; font-weight: 700;
    cursor: pointer; margin-top: 8px;
    transition: opacity 0.15s, transform 0.1s;
  }
  .submit-btn:hover { opacity: 0.92; }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .toast {
    display: none; padding: 14px 16px;
    border-radius: 10px; font-size: 14px;
    margin-top: 12px; text-align: center;
    font-weight: 500; line-height: 1.5;
  }
  .toast.success { background: #EAF3DE; color: #3B6D11; border: 1px solid #C0DD97; }
  .toast.error { background: #FCEBEB; color: #A32D2D; border: 1px solid #F7C1C1; }
  @media (max-width: 400px) {
    .card { padding: 20px 16px 24px; }
    .row2 { grid-template-columns: 1fr; }
    .date-row { grid-template-columns: 80px 1fr 1fr; }
    .mask-top { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="header-badge">수면 · 압력검사 준비</div>
    <h1>검사 장비 신청서</h1>
    <p>마스크를 선택하시면 검사일 전에<br>병원으로 발송해드립니다</p>
  </div>

  <div class="section-label">환자 정보</div>
  <div class="row2">
    <div class="field">
      <label>환자 이름 *</label>
      <input type="text" id="patientName" placeholder="홍길동" autocomplete="name" />
    </div>
    <div class="field">
      <label>전화번호 *</label>
      <input type="tel" id="phone" placeholder="010-1234-5678" inputmode="tel" />
    </div>
  </div>
  <div class="field">
    <label>주민번호 *</label>
    <div style="display:flex;align-items:center;gap:8px;">
      <input type="text" id="rrnFront" placeholder="앞 6자리" maxlength="6" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')" style="flex:1;" />
      <span style="font-size:18px;color:#aaa;flex-shrink:0;">—</span>
      <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
        <input type="text" id="rrnBack1" maxlength="1" inputmode="numeric" oninput="this.value=this.value.replace(/[^0-9]/g,'')" placeholder="0" style="width:44px;text-align:center;" />
        <span style="font-size:18px;color:#ccc;letter-spacing:2px;">●●●●●●</span>
      </div>
    </div>
  </div>

  <hr class="divider" />
  <div class="section-label">마스크 선택</div>
  <div class="mask-options">
    <div class="mask-option" onclick="selectMask(this,'나잘 마스크 (19,000원)')">
      <input type="radio" name="maskType" value="나잘 마스크 (19,000원)" />
      <div class="radio-dot"></div>
      <div class="mask-icon nasal">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="7" width="16" height="10" rx="5" fill="#1D9E75"/><circle cx="11" cy="12" r="2.5" fill="white"/></svg>
      </div>
      <div class="mask-info">
        <div class="mask-top"><span class="mask-name">1번 — 나잘 마스크</span><span class="mask-price">19,000원</span></div>
        <div class="mask-desc">코 전체를 덮는 삼각형 마스크 · 가장 일반적인 타입</div>
      </div>
    </div>
    <div class="mask-option" onclick="selectMask(this,'필로우 마스크 (62,000원)')">
      <input type="radio" name="maskType" value="필로우 마스크 (62,000원)" />
      <div class="radio-dot"></div>
      <div class="mask-icon pillow">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><ellipse cx="11" cy="13" rx="6" ry="5" fill="#378ADD"/><ellipse cx="8.5" cy="12" rx="1.5" ry="2" fill="white"/><ellipse cx="13.5" cy="12" rx="1.5" ry="2" fill="white"/></svg>
      </div>
      <div class="mask-info">
        <div class="mask-top"><span class="mask-name">2번 — 필로우 마스크</span><span class="mask-price">62,000원</span></div>
        <div class="mask-desc">콧구멍에 직접 삽입하는 쿠션형 · 개방감 선호 환자용</div>
      </div>
    </div>
    <div class="mask-option" onclick="selectMask(this,'풀페이스 마스크 (62,000원)')">
      <input type="radio" name="maskType" value="풀페이스 마스크 (62,000원)" />
      <div class="radio-dot"></div>
      <div class="mask-icon fullface">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="4" width="16" height="15" rx="5" fill="#EF9F27"/><rect x="6" y="8" width="10" height="5" rx="2.5" fill="white"/><rect x="7.5" y="14" width="7" height="2" rx="1" fill="white"/></svg>
      </div>
      <div class="mask-info">
        <div class="mask-top"><span class="mask-name">3번 — 풀페이스 마스크</span><span class="mask-price">62,000원</span></div>
        <div class="mask-desc">코와 입을 모두 덮는 마스크 · 구호흡 환자용</div>
      </div>
    </div>
  </div>

  <hr class="divider" />
  <div class="section-label">검사 일정</div>
  <div class="field">
    <label>검사 날짜 *</label>
    <div class="date-row">
      <select id="testYear" onchange="updateDays()" style="font-weight:700;color:#5247D4;">
        <option value="2026">2026년</option>
        <option value="2027">2027년</option>
      </select>
      <select id="testMonth" onchange="updateDays()">
        <option value="">월 선택</option>
        <option value="01">1월</option><option value="02">2월</option>
        <option value="03">3월</option><option value="04">4월</option>
        <option value="05">5월</option><option value="06">6월</option>
        <option value="07">7월</option><option value="08">8월</option>
        <option value="09">9월</option><option value="10">10월</option>
        <option value="11">11월</option><option value="12">12월</option>
      </select>
      <select id="testDay"><option value="">일 선택</option></select>
    </div>
  </div>

  <hr class="divider" />
  <div class="section-label">병원 정보</div>
  <div class="field">
    <label>병원명 * <span style="font-weight:400;color:#aaa;">(지역 포함)</span></label>
    <input type="text" id="hospitalName" placeholder="예) 삼성숨소리의원 강남" />
  </div>

  <button class="submit-btn" id="submitBtn" onclick="submitForm()">전송하기 →</button>
  <div class="toast" id="toast"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxzb6rUC8XD2ntYCHhkmsVaPcunXLeV0CKfxXnej_wql4_34hEKd_IWnwQfXisKPd1n/exec";

  function selectMask(el, val) {
    document.querySelectorAll('.mask-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    el.querySelector('input[type=radio]').checked = true;
  }

  function updateDays() {
    const y = parseInt(document.getElementById('testYear').value);
    const m = parseInt(document.getElementById('testMonth').value);
    const dayEl = document.getElementById('testDay');
    const prev = dayEl.value;
    dayEl.innerHTML = '<option value="">일 선택</option>';
    if (!m) return;
    const count = new Date(y, m, 0).getDate();
    for (let d = 1; d <= count; d++) {
      const v = String(d).padStart(2,'0');
      dayEl.innerHTML += `<option value="${v}"${v===prev?' selected':''}>${d}일</option>`;
    }
  }

  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.innerHTML = msg;
    t.className = 'toast ' + type;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 6000);
  }

  function submitForm() {
    const name     = document.getElementById('patientName').value.trim();
    const rrnF     = document.getElementById('rrnFront').value.trim();
    const rrnB     = document.getElementById('rrnBack1').value.trim();
    const phone    = document.getElementById('phone').value.trim();
    const mask     = document.querySelector('input[name="maskType"]:checked');
    const year     = document.getElementById('testYear').value;
    const month    = document.getElementById('testMonth').value;
    const day      = document.getElementById('testDay').value;
    const hospital = document.getElementById('hospitalName').value.trim();

    if (!name || rrnF.length !== 6 || rrnB.length !== 1 || !phone || !mask || !month || !day || !hospital) {
      showToast('⚠️ 모든 항목을 빠짐없이 입력해주세요.', 'error'); return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true; btn.textContent = '전송 중...';

    // script 태그 방식 - CORS 완전 우회, 한글 인코딩 처리
    const data = {
      제출일시: new Date().toLocaleString('ko-KR'),
      환자이름: name,
      주민번호앞자리: rrnF + '-' + rrnB + '******',
      전화번호: phone,
      마스크타입: mask.value,
      검사날짜: year + '-' + month + '-' + day,
      병원명: hospital,
      callback: 'handleResponse'
    };

    const params = Object.keys(data).map(k => encodeURIComponent(k) + '=' + encodeURIComponent(data[k])).join('&');

    window.handleResponse = function() {
      showToast('✅ 전송 완료!<br>검사일 전 병원으로 발송해드리겠습니다.', 'success');
      document.getElementById('patientName').value = '';
      document.getElementById('rrnFront').value = '';
      document.getElementById('rrnBack1').value = '';
      document.getElementById('phone').value = '';
      document.getElementById('hospitalName').value = '';
      document.querySelectorAll('.mask-option').forEach(o => o.classList.remove('selected'));
      document.querySelectorAll('input[type=radio]').forEach(r => r.checked = false);
      document.getElementById('testYear').value = '2026';
      document.getElementById('testMonth').value = '';
      document.getElementById('testDay').innerHTML = '<option value="">일 선택</option>';
      btn.disabled = false; btn.textContent = '전송하기 →';
      document.getElementById('gasScript').remove();
    };

    const script = document.createElement('script');
    script.id = 'gasScript';
    script.src = SCRIPT_URL + '?' + params;
    script.onerror = function() {
      // script 태그 오류는 무시하고 성공으로 처리 (no-cors와 동일)
      window.handleResponse();
    };
    document.body.appendChild(script);

    // 3초 후에도 응답 없으면 성공으로 처리
    setTimeout(function() {
      if (btn.disabled) {
        window.handleResponse();
      }
    }, 3000);
  }
</script>
</body>
</html>
